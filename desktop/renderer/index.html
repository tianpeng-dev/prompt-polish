<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; font-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>精炼台</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="compact-shell">
      <section class="prompt-box" aria-label="提示词优化输入框">
        <div class="window-drag-rail" aria-hidden="true"></div>
        <button
          class="pin-button"
          id="pin-button"
          type="button"
          aria-label="取消窗口置顶"
          aria-pressed="true"
          title="取消窗口置顶"
        >
          <span class="icon icon--pin" aria-hidden="true"></span>
        </button>
        <label class="sr-only" for="editor">需要优化的提示词</label>
        <textarea
          id="editor"
          maxlength="2000"
          spellcheck="false"
          autofocus
          placeholder="输入需要优化的内容…"
        ></textarea>
        <div class="refresh-layer" aria-hidden="true">
          <div class="refresh-text" id="refresh-text"></div>
        </div>

        <p
          class="toast"
          id="status"
          role="status"
          aria-live="polite"
          hidden
        ></p>

        <button
          class="action-button"
          id="action-button"
          type="button"
          data-mode="optimize"
          aria-label="优化输入内容"
          title="优化输入内容（Enter）"
          disabled
        >
          <span
            class="icon action-icon action-icon--optimize icon--sparkles"
            aria-hidden="true"
          ></span>
          <span
            class="icon action-icon action-icon--undo icon--undo"
            aria-hidden="true"
          ></span>
        </button>
      </section>

      <section
        class="settings-panel"
        id="settings-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="settings-title"
        hidden
      >
        <div class="settings-heading window-drag-heading">
          <h2 id="settings-title">设置</h2>
          <button
            class="close-button"
            id="settings-close"
            type="button"
            aria-label="关闭设置"
          >
            <span class="icon icon--close" aria-hidden="true"></span>
          </button>
        </div>

        <label class="setting-row" for="launch-toggle">
          <span>
            <strong>登录时启动</strong>
            <small>静默驻留在系统托盘</small>
          </span>
          <input id="launch-toggle" type="checkbox" />
          <span class="switch" aria-hidden="true"></span>
        </label>

        <label class="setting-row" for="shortcut-clipboard-toggle">
          <span>
            <strong>快捷键自动优化剪贴板</strong>
            <small>填入、优化并覆盖剪贴板</small>
          </span>
          <input id="shortcut-clipboard-toggle" type="checkbox" />
          <span class="switch" aria-hidden="true"></span>
        </label>

        <div class="setting-row">
          <span>
            <strong>全局快捷键</strong>
            <small>点击后按下新组合键</small>
          </span>
          <button
            class="shortcut-recorder"
            id="shortcut-recorder"
            type="button"
          >
            <kbd id="shortcut-label">⌥⌘P</kbd>
          </button>
        </div>
        <p
          class="settings-status"
          id="settings-status"
          role="status"
          aria-live="polite"
        ></p>
      </section>
    </main>
    <script type="module" src="../../dist/desktop/renderer/app.js"></script>
  </body>
</html>
